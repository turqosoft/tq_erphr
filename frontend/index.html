<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
		/>
		<title>MobiBiz Lite</title>

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="MobiBiz Lite" />
		<meta name="apple-mobile-web-app-status-bar-style" content="white" />
		<meta name="theme-color" content="#14b8a6" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- PWA Favicon & Apple Touch Icons -->
		<link
			rel="icon"
			type="image/png"
			sizes="196x196"
			href="/assets/tq_erphr/frontend/manifest/favicon-196.png"
		/>
		<link
			rel="apple-touch-icon"
			href="/assets/tq_erphr/frontend/manifest/apple-icon-180.png"
		/>

		<!-- Apple Splash Images -->
		<link
			rel="apple-touch-startup-image"
			href="/assets/tq_erphr/frontend/manifest/apple-splash-2048-2732.jpg"
			media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/tq_erphr/frontend/manifest/apple-splash-1668-2388.jpg"
			media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/tq_erphr/frontend/manifest/apple-splash-1536-2048.jpg"
			media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/tq_erphr/frontend/manifest/apple-splash-1125-2436.jpg"
			media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/tq_erphr/frontend/manifest/apple-splash-1242-2688.jpg"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/tq_erphr/frontend/manifest/apple-splash-828-1792.jpg"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/tq_erphr/frontend/manifest/apple-splash-750-1334.jpg"
			media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
	</head>
	<body class="bg-slate-100 text-slate-900 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
		<div id="app"></div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = '{{ site_name }}'
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot }}
		</script>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
